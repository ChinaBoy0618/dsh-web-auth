# ============================================================================
# dsh-web-auth 的 bundle patch —— 把公网鉴权门挂进 DSH Web 进程
# ============================================================================
#
# 这是什么:
#   DSH 启动时按 bundle 层栈叠加各插件的 patch。本文件声明 web-auth 插件行:
#   一个只在 loopback 上监听的反向代理(默认 127.0.0.1:3081),
#   把 frp 隧道流量校验 token 后代转到 DSH web(Host 头改写为 loopback,
#   信任栅栏天然放行)。
#
# token 从哪来(按优先级):
#   1. 下面 config.token 行配置
#   2. 环境变量 DSH_WEB_AUTH_TOKEN
#   3. 文件 $DSH_HOME/web-auth-token (默认 ~/.dsh/web-auth-token, 可配 tokenFile)
#
# 公网入口 = 让 frpc 指向 gatePort(3081), 而不是 DSH web 的 3080。
#
# ============================================================================

- insert:
    - id: web-auth
      name: 'dsh-web-auth'
      inject: [webServer]
      config:
        gateHost: '127.0.0.1'
        gatePort: 3081
        tokenFile: 'web-auth-token'
